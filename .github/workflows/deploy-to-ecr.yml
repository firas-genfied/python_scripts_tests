name: Build and Push to Amazon ECR

on:
  push:
    branches:
      - feature/milvusvectordb
      - feature/kafaintegration

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'
      # - name: Free disk space
      #   run: |
      #     # Remove large packages
      #     sudo rm -rf /usr/share/dotnet
      #     sudo rm -rf /opt/ghc
      #     sudo rm -rf /usr/local/share/boost
      #     sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      #     # Remove unnecessary apt packages - using a different approach
      #     sudo apt-get remove -y mono-devel || true
      #     sudo apt-get remove -y ghc* || true
      #     sudo apt-get remove -y dotnet* || true
      #     sudo apt-get remove -y azure-cli google-cloud-sdk firefox powershell || true
      #     sudo apt-get remove -y google-chrome-stable microsoft-edge-stable || true
      #     sudo apt-get remove -y llvm-* || true
      #     sudo apt-get autoremove -y
      #     sudo apt-get clean
      #     # Show available space
      #     df -h
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver: docker-container


      - name: Build and push with cache
        uses: docker/build-push-action@v4
        with:
          context: .
          builder: default
          push: true
          tags: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
          cache-from: type=inline
          cache-to: type=inline