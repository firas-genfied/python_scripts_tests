apiVersion: v1
kind: ConfigMap
metadata:
  name: stress-test-extreme-config
  namespace: genfied
  labels:
    app: stress-test-milvus
data:
  # Extreme load: 150 cameras total
  extreme-150cam-args: |
    --stores 15
    --cameras-per-store 10
    --fps 8.0
    --duration 300
    --batch-size 100
    --batch-time 1.0
    --router-url http://milvus-router.genfied.svc.cluster.local
    --max-concurrent 500
    --buffer-size 1500
    --batching-strategy per-camera
  
  # Alternative extreme config with higher FPS
  extreme-150cam-high-fps-args: |
    --stores 10
    --cameras-per-store 15
    --fps 10.0
    --duration 180
    --batch-size 120
    --batch-time 0.8
    --router-url http://milvus-router.genfied.svc.cluster.local
    --max-concurrent 750
    --buffer-size 2000
    --batching-strategy per-camera
  
  # Environment variables for extreme testing
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: "INFO"
