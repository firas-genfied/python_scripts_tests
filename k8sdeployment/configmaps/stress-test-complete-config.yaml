apiVersion: v1
data:
  LOG_LEVEL: INFO
  PYTHONUNBUFFERED: "1"
  default-args: |
    --stores 5
    --cameras-per-store 3
    --fps 5.0
    --duration 120
    --batch-size 50
    --batch-time 2.0
    --router-url http://milvus-router.genfied.svc.cluster.local
    --max-concurrent 100
    --buffer-size 300
    --batching-strategy per-camera
  heavy-args: |
    --stores 10
    --cameras-per-store 5
    --fps 8.0
    --duration 180
    --batch-size 70
    --batch-time 1.5
    --router-url http://milvus-router.genfied.svc.cluster.local
    --max-concurrent 200
    --buffer-size 500
    --batching-strategy per-camera
  light-args: |
    --stores 2
    --cameras-per-store 2
    --fps 2.0
    --duration 60
    --batch-size 30
    --batch-time 2.0
    --router-url http://milvus-router.genfied.svc.cluster.local
    --max-concurrent 50
    --buffer-size 150
    --batching-strategy per-camera
